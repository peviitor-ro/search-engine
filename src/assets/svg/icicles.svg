       C 80,2.1 75,1.4 70,1.3
       L 67.6,20.2 C 67.3,22.2 66.7,22.2 66.4,20.2 L 64.2,1.7
       C 58,2 51,1.5 46,1.3
       L 44.6,9.5 C 44.4,10.6 43.9,10.6 43.7,9.5 L 42.5,1.5
       C 37.5,1.8 34,1.6 31.2,1.4
