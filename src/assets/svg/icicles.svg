<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 34" preserveAspectRatio="none">
  <defs>
    <linearGradient id="iceBody1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f8ff" stop-opacity="0.88" />
      <stop offset="35%" stop-color="#a8e2ff" stop-opacity="0.72" />
      <stop offset="78%" stop-color="#69c2f5" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#dff6ff" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="iceShadow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ba7e0" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#2b7cb8" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="iceHighlight1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

