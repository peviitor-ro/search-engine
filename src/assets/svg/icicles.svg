       M 100.0,1.6 L 102.6,1.6 L 100.0,27.0 Z
       M 121.0,1.5 L 122.9,1.5 L 121.0,15.8 Z"
  />

  <!-- Crisp white glass specular ridges (left edge of each icicle) -->
  <path
    fill="url(#iceHighlight1)"
    d="M 24.4,1.6 L 26.1,1.6 L 26.9,28.5 Z
       M 65.1,1.5 L 66.3,1.5 L 66.9,18.5 Z
