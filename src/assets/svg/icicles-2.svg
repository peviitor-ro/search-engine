<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 34" preserveAspectRatio="none">
  <defs>
    <linearGradient id="iceBody2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f8ff" stop-opacity="0.88" />
      <stop offset="35%" stop-color="#a8e2ff" stop-opacity="0.72" />
      <stop offset="78%" stop-color="#69c2f5" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#dff6ff" stop-opacity="0.92" />
