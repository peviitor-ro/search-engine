    fill="url(#iceHighlight2)"
    d="M 12.6,1.6 L 14.2,1.6 L 15.0,29.0 Z
       M 42.2,1.6 L 43.8,1.6 L 44.6,26.5 Z
       M 65.7,1.6 L 67.0,1.6 L 67.6,20.8 Z
